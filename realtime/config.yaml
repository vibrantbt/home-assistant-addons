---
name: "Vibrant Realtime Server"
slug: "vbt-realtime"
version: "20898355897"
description: "Internal service that enables real-time updates to gateway database on mobile app and zone manager."
startup: services
init: false
host_network: true
arch:
  - aarch64
image: harbor-dev.vibrantbt.net/gateway/realtime
map:
  - data:rw

# Allow GatewayOS provisioning to configure this add-on via Supervisor options.
# (Environment variables can still be used as a fallback.)
options:
  database_url: ""
  http_port: 7777
schema:
  database_url: str?
  http_port: int?
ports:
  "7777/tcp": 7777
ports_description:
  "7777/tcp": "Vibrant Realtime HTTP"
